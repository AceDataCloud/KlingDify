    en_US: Set action for this operation.
    zh_Hans: 设置操作。
  llm_description: Set action for this operation.
  options:
  - value: list
    label:
      en_US: list
      zh_Hans: list
  - value: presets
    label:
      en_US: presets
      zh_Hans: presets
  - value: retrieve
    label:
      en_US: retrieve
      zh_Hans: retrieve
  - value: delete
    label:
      en_US: delete
      zh_Hans: delete
  - value: create
    label:
      en_US: create
      zh_Hans: create
